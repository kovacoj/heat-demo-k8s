apiVersion: v1
kind: ServiceAccount
metadata:
  name: weakheat-api
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: weakheat-api
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: weakheat-api
subjects:
  - kind: ServiceAccount
    name: weakheat-api
roleRef:
  kind: Role
  name: weakheat-api
  apiGroup: rbac.authorization.k8s.io
