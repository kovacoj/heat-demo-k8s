apiVersion: apps/v1
kind: Deployment

metadata:
  name: heat-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: heat-demo

  template:
    metadata:
      labels:
        app: heat-demo

    spec:

      # May create/delete simulation Jobs in this namespace.
      serviceAccountName: heat-api

      terminationGracePeriodSeconds: 30

      securityContext:
        runAsUser: 1000
        runAsNonRoot: true

        seccompProfile:
          type: RuntimeDefault

      containers:

        - name: heat-demo

          image: cerit.io/kovacoj1/heat-firedrake:dev

          imagePullPolicy: Always

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 8080

          env:

            # Overridden with the real tag by `make deploy`:
            # simulation Jobs run the same image as this pod.
            - name: SIM_IMAGE
              value: "cerit.io/kovacoj1/heat-firedrake:dev"

            - name: SIM_MPI_RANKS
              value: "10"

            - name: SIM_MAX_SIMS
              value: "3"

            # Overridden with the real tag by `make deploy`:
            # the OpenFOAM simulation Jobs run this image.
            - name: OF_IMAGE
              value: "cerit.io/kovacoj1/heat-openfoam:dev"

          resources:

            # Tiny now: this pod only schedules Jobs and
            # relays their logs.
            requests:
              cpu: "200m"
              memory: "512Mi"

            limits:
              cpu: "1"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 30
