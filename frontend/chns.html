<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Firedrake CHNS</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 30px;

      background: #0b1020;

      color: #edf2f7;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }

    .page {

      max-width: 900px;

      margin: 0 auto;

    }

    h1 {

      margin-top: 0;

      margin-bottom: 4px;

      font-size: 28px;

      font-weight: 650;

    }

    .subtitle {

      color: #94a3b8;

      margin-bottom: 24px;

    }

    .layout {

      display: grid;

      grid-template-columns:
        minmax(0, 1fr)
        260px;

      gap: 24px;

      align-items: start;

    }

    .lamp {

      min-width: 0;

    }

    .lamp-row {

      display: flex;

      gap: 10px;

      align-items: stretch;

      justify-content: center;

    }

    .canvas-wrap {

      position: relative;

      /* Sized by viewport height so the tall lamp fits
         on a notebook screen; width follows from the
         1:2 aspect ratio. */

      width: min(24vh, 340px, 86vw);

      aspect-ratio: 1 / 3;

      background: #050810;

      border: 1px solid #334155;

      overflow: hidden;

      border-radius: 8px;

    }

    canvas {

      display: block;

      width: 100%;

      height: 100%;

    }

    .colorbar {

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 6px;

    }

    .colorbar-label {

      color: #8290a6;

      font-size: 11px;

      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        monospace;

      line-height: 1;

    }

    .gradient {

      flex: 1;

      width: 14px;

      border-radius: 3px;

      /* T = 1 (hot) at the bottom, T = 0 (cold) at the top,
         matching the lamp geometry. */

      background:
        linear-gradient(
          0deg,
          rgb(255, 250, 220),
          rgb(240, 175, 45),
          rgb(20, 145, 145),
          rgb(18, 60, 120),
          rgb(5, 10, 30)
        );

      border: 1px solid #334155;

    }

    .panel {

      background: #111827;

      border: 1px solid #263244;

      border-radius: 8px;

      padding: 18px;

    }

    #status {

      min-height: 38px;

      color: #93a4b8;

      font-size: 13px;

      line-height: 1.45;

    }

    .nav {

      margin-bottom: 16px;

      font-size: 13px;

    }

    .nav a {

      color: #7fa3c8;

      text-decoration: none;

      margin-right: 16px;

    }

    .nav a:hover {

      color: #cfe3f7;

    }

    @media (max-width: 800px) {

      body {
        padding: 15px;
      }

      .layout {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>

<div class="page">

  <div class="nav">
    <a href="./">lava lamp</a>
    <a href="./ch.html">cahn-hilliard</a>
    <a href="./chns.html">chns</a>
  </div>

  <h1>Rising bubbles (CHNS)</h1>

  <div class="subtitle">
    Cahn–Hilliard–Navier–Stokes on a 16-rank MPI pod on CERIT Kubernetes
  </div>


  <div class="layout">


    <div class="lamp">

      <div class="lamp-row">

        <div class="canvas-wrap">
          <canvas
            id="canvas"
            width="384"
            height="768"
          ></canvas>
        </div>

        <div class="colorbar">
          <span class="colorbar-label">0.0</span>
          <div class="gradient"></div>
          <span class="colorbar-label">1.0</span>
        </div>

      </div>

    </div>


    <div class="panel">

      <div id="status">
        Connecting to CERIT...
      </div>

    </div>

  </div>

</div>


<script>

const API =
  "https://heat-kovacovsky-ns.dyn.cloud.e-infra.cz";


const canvas =
  document.getElementById("canvas");

const ctx =
  canvas.getContext("2d");


const statusElement =
  document.getElementById("status");


let gridX = 24;

let gridY = 72;


/*
 * Offscreen raster at the Firedrake sampling resolution
 * (grid_x × grid_y), upscaled onto the visible canvas.
 */

const raster =
  document.createElement("canvas");

const rasterContext =
  raster.getContext("2d");


ctx.imageSmoothingEnabled = true;

ctx.imageSmoothingQuality = "high";


function clamp(value, min, max) {

  return Math.min(
    max,
    Math.max(
      min,
      value
    )
  );

}


/*
 * Fixed perceptual-ish temperature palette.
 *
 * IMPORTANT:
 * We do not normalize separately each timestep.
 * T=0 and T=1 always mean the same colours.
 */

const colourStops = [

  [0.00, [5, 10, 30]],

  [0.22, [18, 60, 120]],

  [0.48, [20, 145, 145]],

  [0.74, [240, 175, 45]],

  [1.00, [255, 250, 220]]

];

function colour(value) {

  const t =
    clamp(value, 0, 1);

  for (
    let i = 0;
    i < colourStops.length - 1;
    i++
  ) {

    const left =
      colourStops[i];

    const right =
      colourStops[i + 1];

    if (
      t >= left[0]
      &&
      t <= right[0]
    ) {

      const q =
        (
          t - left[0]
        )
        /
        (
          right[0] - left[0]
        );

      return [

        Math.round(
          left[1][0]
          +
          q
          *
          (
            right[1][0]
            -
            left[1][0]
          )
        ),

        Math.round(
          left[1][1]
          +
          q
          *
          (
            right[1][1]
            -
            left[1][1]
          )
        ),

        Math.round(
          left[1][2]
          +
          q
          *
          (
            right[1][2]
            -
            left[1][2]
          )
        )

      ];

    }

  }

  return colourStops[
    colourStops.length - 1
  ][1];

}


function renderFrame(values) {

  const nx = gridX;

  const ny = gridY;

  raster.width = nx;

  raster.height = ny;

  const image =
    rasterContext.createImageData(
      nx,
      ny
    );

  /*
   * Firedrake point order:
   *
   * row 0 is y=0 (the hot bottom).
   *
   * Canvas:
   *
   * row 0 is the top.
   *
   * Therefore flip Y here.
   */

  for (
    let screenY = 0;
    screenY < ny;
    screenY++
  ) {

    const firedrakeY =
      ny - 1 - screenY;

    for (
      let x = 0;
      x < nx;
      x++
    ) {

      const inputIndex =
        firedrakeY * nx + x;

      const outputIndex =
        (
          screenY * nx + x
        )
        * 4;

      const rgb =
        colour(
          values[inputIndex]
        );

      image.data[outputIndex] = rgb[0];

      image.data[outputIndex + 1] = rgb[1];

      image.data[outputIndex + 2] = rgb[2];

      image.data[outputIndex + 3] = 255;

    }

  }

  rasterContext.putImageData(
    image,
    0,
    0
  );

  ctx.drawImage(
    raster,
    0,
    0,
    canvas.width,
    canvas.height
  );

}


async function start() {

  statusElement.textContent =
    "Connecting to CERIT...";

  try {

    const response =
      await fetch(
        API + "/simulate-chns",
        {

          method: "POST"

        }
      );

      if (!response.ok) {

        if (response.status === 409) {

          throw new Error(
            "Another viewer is already running the lamp. Try again in a moment."
          );

        }

        const text =
          await response.text();

        throw new Error(
          `HTTP ${response.status}: ${text}`
        );

      }

      if (!response.body) {

        throw new Error(
          "Streaming responses are not supported by this browser."
        );

      }

      const reader =
        response.body.getReader();

      const decoder =
        new TextDecoder();

      let buffer = "";

      while (true) {

        const {
          value,
          done
        } =
          await reader.read();

        if (done) {
          break;
        }

        buffer +=
          decoder.decode(
            value,
            {
              stream: true
            }
          );

        const lines =
          buffer.split("\n");

        buffer =
          lines.pop();

        for (
          const line of lines
        ) {

          if (!line.trim()) {
            continue;
          }

          const message =
            JSON.parse(line);

          if (
            message.type
            ===
            "status"
          ) {

            // Build-progress noise is not shown; the status
            // line is reserved for errors.

          }

          else if (
            message.type
            ===
            "meta"
          ) {

            gridX =
              message.grid_x;

            gridY =
              message.grid_y;

          }

          else if (
            message.type
            ===
            "frame"
          ) {

            if (statusElement.textContent !== "") {
              statusElement.textContent = "";
            }

            renderFrame(
              message.values
            );

          }

          else if (
            message.type
            ===
            "done"
          ) {

            statusElement.textContent =
              "Simulation complete.";

          }

          else if (
            message.type
            ===
            "error"
          ) {

            throw new Error(
              message.message
            );

          }

        }

      }

    }

    catch (error) {

      console.error(error);

      statusElement.textContent =
        `Error: ${error.message}`;

    }

  }

// The lamp starts by itself.

start();


</script>

</body>

</html>
