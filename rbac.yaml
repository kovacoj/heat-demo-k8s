# Permissions for the API pod: it launches one Kubernetes
# Job per browser session and follows the job pod's logs to
# stream results back to the browser.
apiVersion: v1
kind: ServiceAccount

metadata:
  name: heat-api


---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: heat-api-simulations

rules:

  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]

  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]


---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: heat-api-simulations

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: heat-api-simulations

subjects:

  - kind: ServiceAccount
    name: heat-api
